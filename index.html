<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clasic Geomatry</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; margin: auto; background: #111; }
</style>
</head>
<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, obstacles, speed, score;

// 🔁 게임 초기화
function resetGame() {
  player = {
    x: 100,
    y: 300,
    w: 30,
    h: 30,
    dy: 0,
    gravity: 0.8,
    jump: -12,
    grounded: true,
    angle: 0
  };

  obstacles = [];
  speed = 5;
  score = 0;
}

resetGame();

// 점프
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && player.grounded) {
    player.dy = player.jump;
    player.grounded = false;
  }
});

function update() {
  player.dy += player.gravity;
  player.y += player.dy;

  if (!player.grounded) {
    player.angle += 10;
  }

  if (player.y >= 300) {
    player.y = 300;
    player.dy = 0;
    player.grounded = true;
    player.angle = 0;
  }

  let minGap = 250;

  if (Math.random() < 0.02) {
    if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 800 - minGap) {
      obstacles.push({ x: 800, y: 300, size: 30 });
    }
  }

  obstacles.forEach(o => o.x -= speed);

  for (let o of obstacles) {
    if (
      player.x < o.x + o.size &&
      player.x + player.w > o.x &&
      player.y < o.y + o.size &&
      player.y + player.h > o.y
    ) {
      alert("게임 오버! 점수: " + score);
      resetGame();
      return;
    }
  }

  score++;
  obstacles = obstacles.filter(o => o.x > -50);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 바닥
  ctx.fillStyle = "blue";
  ctx.fillRect(0, 330, canvas.width, 70);

  // 플레이어
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.rotate(player.angle * Math.PI / 180);
  ctx.fillStyle = "cyan";
  ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
  ctx.restore();

  // 삼각형 장애물
  ctx.fillStyle = "red";
  obstacles.forEach(o => {
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.size);
    ctx.lineTo(o.x + o.size / 2, o.y);
    ctx.lineTo(o.x + o.size, o.y + o.size);
    ctx.closePath();
    ctx.fill();
  });

  // 점수
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 30);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
